name: Check ibapi for updates

on:
  schedule:
    # Run at 06:00 UTC daily — after ibapi's own 00:00 UTC update run
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Record current ibapi commit
        id: before
        run: |
          SHA=$(python -c "import tomllib; d=tomllib.load(open('poetry.lock','rb')); print(next(p['source']['resolved_reference'] for p in d['package'] if p['name']=='ibapi'))")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current ibapi commit: $SHA"

      - name: Update ibapi dependency
        id: update
        run: |
          poetry update ibapi --no-interaction
          SHA=$(python -c "import tomllib; d=tomllib.load(open('poetry.lock','rb')); print(next(p['source']['resolved_reference'] for p in d['package'] if p['name']=='ibapi'))")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if git diff --quiet poetry.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No ibapi update available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ibapi updated to $SHA"
          fi

      - name: Run tests against new ibapi version
        if: steps.update.outputs.changed == 'true'
        run: poetry run pytest tests/ -x --tb=short

      # PRs created with the default GITHUB_TOKEN do NOT trigger other workflows
      # (GitHub safety feature against recursive workflow loops). To get `ci.yml`
      # running on these auto PRs, create a fine-grained PAT or GitHub App token
      # with `contents: write` and `pull_requests: write`, store it as the
      # `AUTOMATION_TOKEN` repo secret. Falls back to GITHUB_TOKEN if unset (the
      # PR will open but CI must be triggered manually by closing/reopening).
      - name: Open PR if ibapi changed and tests pass
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          branch: auto/ibapi-update-${{ steps.update.outputs.sha }}
          title: "chore: bump ibapi to ${{ steps.update.outputs.sha }}"
          body: |
            ## Automated ibapi dependency bump

            | | Value |
            |---|---|
            | **Previous commit** | `${{ steps.before.outputs.sha }}` |
            | **New commit** | `${{ steps.update.outputs.sha }}` |

            Tests passed against the new ibapi version. Review and merge to adopt.

            > Generated by the `check-ibapi-updates` workflow.
          commit-message: "chore: bump ibapi dependency to ${{ steps.update.outputs.sha }}"
          labels: "dependencies,automated"
